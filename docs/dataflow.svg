<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" font-family="system-ui,-apple-system,sans-serif">
  <style>
    .pl{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}
    .ps{fill:#ecfdf5;stroke:#059669;stroke-width:2}
    .t{fill:#0f172a;font-size:13px;font-weight:600}
    .ms{fill:#334155;font-size:12px}
    .h{font-size:12px;font-weight:700}
    .ar{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a2)}
  </style>
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker>
  </defs>

  <text class="h" fill="#4f46e5" x="20" y="28">programmable logic</text>
  <text class="h" fill="#059669" x="330" y="28">CPU (Python)</text>

  <rect class="pl" x="20"  y="46" width="120" height="60" rx="6"/>
  <text class="t"  x="80"  y="72" text-anchor="middle">HDMI in</text>
  <text class="ms" x="80"  y="92" text-anchor="middle">dvi2rgb + VDMA</text>

  <rect class="ps" x="180" y="46" width="120" height="60" rx="6"/>
  <text class="t"  x="240" y="72" text-anchor="middle">crop + resize</text>
  <text class="ms" x="240" y="92" text-anchor="middle">720p to 32x32</text>

  <rect class="pl" x="340" y="46" width="120" height="60" rx="6"/>
  <text class="t"  x="400" y="72" text-anchor="middle">cnv-w1a1</text>
  <text class="ms" x="400" y="92" text-anchor="middle">1-bit CNN</text>

  <rect class="ps" x="500" y="46" width="120" height="60" rx="6"/>
  <text class="t"  x="560" y="72" text-anchor="middle">draw label</text>
  <text class="ms" x="560" y="92" text-anchor="middle">in place</text>

  <rect class="pl" x="660" y="46" width="120" height="60" rx="6"/>
  <text class="t"  x="720" y="72" text-anchor="middle">HDMI out</text>
  <text class="ms" x="720" y="92" text-anchor="middle">VDMA + rgb2dvi</text>

  <path class="ar" d="M142,76 L176,76"/>
  <path class="ar" d="M302,76 L336,76"/>
  <path class="ar" d="M462,76 L496,76"/>
  <path class="ar" d="M622,76 L656,76"/>

  <text class="ms" x="80"  y="132" text-anchor="middle">6.3 ms</text>
  <text class="ms" x="240" y="132" text-anchor="middle">16 ms</text>
  <text class="ms" x="400" y="132" text-anchor="middle">2.6 ms</text>
  <text class="ms" x="560" y="132" text-anchor="middle">&lt;1 ms</text>
  <text class="ms" x="720" y="132" text-anchor="middle">6.4 ms</text>

  <text class="ms" x="20" y="170">31.1 fps at 1280x720, no frame copies</text>
</svg>
